    if (pressV[rid] > 0.05) { ctx.fillStyle = `rgba(208,2,27,${0.14 * pressV[rid]})`; ctx.fillRect(0, y, W, rowH); }
    else if (i % 2 === 0) { ctx.fillStyle = 'rgba(208,2,27,0.04)'; ctx.fillRect(0, y, W, rowH); }
    withScale(180, y + rowH / 2, ps, () => {
      ctx.globalAlpha = used ? 0.6 : 1;
      ctx.beginPath(); ctx.arc(36, y + rowH / 2, 17, 0, 7);
      if (used) { ctx.fillStyle = C.redSoft; ctx.fill(); ctx.strokeStyle = C.red; } else ctx.strokeStyle = C.goldDark;
      ctx.lineWidth = 1.2; ctx.stroke();
      text(s[0], 36, y + rowH / 2 + 4, F.sans(11, 800), used ? C.redInk : C.goldDark, 'center');
      text(fit(s[1], F.sans(16, 700), 270), 62, y + 24, F.sans(16, 700), C.ink);
      text(fit(used ? t('guessed') : (lang === 'ms' ? s[3] : s[2]), F.sans(13, used ? 700 : 400), 270), 62, y + 42, F.sans(13, used ? 700 : 400), used ? C.red : C.ink2);
      ctx.globalAlpha = 1;
    });
    if (!used && active) hit(0, y, W, rowH, () => { vib(10); guess(s[0]); }, [top, bottom], rid);
  }
  if (!list.length) text(t('noResult'), W / 2, top + 40, F.sans(15, 500), C.ink2, 'center');
  ctx.restore();
}
function placeInput(x, y, w, h) {
  const r = cv.getBoundingClientRect();
  qi.style.left = (r.left + ox + x * scale) + 'px'; qi.style.top = (r.top + oy + y * scale) + 'px';
  qi.style.width = (w * scale) + 'px'; qi.style.height = (h * scale) + 'px';
}

// The answer page fits one screen: the summary drops a size if the card would run long.
function drawResult() {
  drawBackdrop();
  const p = cur, st = prog[p.id], s = city(p.answer), e = enter.result;
  header(`${p.diff[lang]} · ${p.day[lang]}`); langToggle();
  const step = (d, dur = 450) => reduce ? 1 : easeOut(k01(e + d, dur));
  const avail = 556 - 82;
  let fs = 16, lh = 21, sumL, cardH;
  const measure = () => {
    sumL = wrap(p.summary[lang], F.sans(fs, 400), 296);
    cardH = 250 + sumL.length * lh;
  };
  measure(); while (cardH > avail && fs > 13) { fs--; lh--; measure(); }
  const y = 82 + Math.max(0, (avail - cardH) / 2);
  const kc = reduce ? 1 : easeBack(k01(e + 60, 560));
  withScale(180, y + cardH / 2, 0.9 + 0.1 * kc, () => {
    ctx.globalAlpha = clamp(kc, 0, 1);
    fillRR(16, y + 4, 328, cardH, 14, 'rgba(0,0,0,0.25)');
    fillRR(16, y, 328, cardH, 14, C.parch);
    strokeRR(21, y + 5, 318, cardH - 10, 10, 'rgba(196,18,43,0.18)');
    ctx.save(); ctx.globalAlpha = 0.25 * clamp(kc, 0, 1); ctx.strokeStyle = C.goldDark; ctx.lineWidth = 1.4; ctx.setLineDash([5, 6]); ctx.lineDashOffset = -now / 60;
    ctx.beginPath(); ctx.arc(W / 2, y + 70, 48, 0, 7); ctx.stroke(); ctx.restore();
    ctx.globalAlpha = step(250);
    text((st.solved ? t('solvedIn')(st.guesses.length) : t('missed')).toUpperCase(), W / 2, y + 28, F.sans(12, 700), st.solved ? C.green : C.red, 'center');
    const ka = reduce ? 1 : easeBack(k01(e + 350, 600));
    ctx.globalAlpha = clamp(ka, 0, 1);
    withScale(W / 2, y + 66, 0.6 + 0.4 * ka, () => text(s[0], W / 2, y + 82, F.ar(34), C.goldDark, 'center'));
    ctx.globalAlpha = step(550);
    text(fit(s[1], F.kufi(24), 296), W / 2, y + 128 + (1 - step(550)) * 10, F.kufi(24), C.ink, 'center');
    text(`${lang === 'ms' ? s[3] : s[2]} · ${t('fromKL')(fmt(km(city('KUL'), s)))}`, W / 2, y + 148, F.sans(13, 500), C.ink2, 'center');
    ctx.globalAlpha = 1;
    for (let j = 0; j < 6; j++) {
      const n = st.guesses.length, x = W / 2 - 3 * 24 + j * 24 + 2;
      const c = j < n ? (st.solved && j === n - 1 ? C.green : C.red) : C.grey;
      const kq = reduce ? 1 : easeBack(k01(e + 700 + j * 90, 380));
      if (kq > 0) withScale(x + 10, y + 168, kq, () => fillRR(x, y + 158, 20, 20, 5, c));
    }
    let cy = y + 196;
    ctx.globalAlpha = step(1100);
    ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(32, cy - 6, 296, 1);
    sumL.forEach((ln, j) => text(ln, 32, cy + 14 + j * lh + (1 - step(1100)) * 8, F.sans(fs, 400), C.ink));
    cy += 4 + sumL.length * lh;
    cy += 16;
    ctx.globalAlpha = step(1250);
    text(fit(t('draft'), F.sans(11, 400), 296), 32, cy + 10, F.sans(11, 400), C.muted);
    ctx.globalAlpha = 1;
  });
  button('copy', 16, 566, 158, 54, C.gold, t('copy'), F.sans(17, 700), C.ink, () => copyResult(p), true);
  button('fly', 186, 566, 158, 54, C.parch, fit(t('flights')(s[0]), F.sans(16, 700), 140), F.sans(16, 700), C.goldDark, () => showToast(t('flightsToast')(s[1])));
  const bk = 'res' + p.id + e;
  if (st.solved && !burstDone[bk] && now > e + 420 && !reduce) { burstDone[bk] = 1; burst(W / 2, y + 70, [C.gold, C.goldLight, C.green, C.red], 40); }
}

function drawParticles() {
  particles = particles.filter(q => now - q.born < q.life);
  for (const q of particles) {
    const a = (now - q.born) / q.life;
    q.vy += 520 * dt; q.vx *= 0.985; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    ctx.globalAlpha = 1 - a * a; ctx.fillStyle = q.c;
    starPath(q.x, q.y, q.r, q.rot); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawToast() {
  if (!toast) return; const age = now - toast.at; if (age > 2200) { toast = null; return; }
  const a = Math.min(1, age / 160, (2200 - age) / 300), lines = wrap(toast.s, F.sans(14, 700), 280), h = 20 + lines.length * 18;
  const y = 548 - h + (1 - easeOut(Math.min(1, age / 260))) * 30;
  ctx.globalAlpha = a; fillRR(30, y, 300, h, 12, C.ink);
  lines.forEach((ln, j) => text(ln, W / 2, y + 24 + j * 18, F.sans(14, 700), C.parch, 'center'));
  ctx.globalAlpha = 1;
}

function drawScreen(name) {
  if (name === 'splash') drawSplash();
  else if (name === 'home') drawHome();
  else if (name === 'puzzle') drawPuzzle();
  else if (name === 'result') drawResult();
}

function frame(ts) {
  now = ts; dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
  pk += (pkTarget - pk) * Math.min(1, dt * (reduce ? 60 : 11));
  lift += ((pkTarget === 1 && document.activeElement === qi ? 1 : 0) - lift) * Math.min(1, dt * (reduce ? 60 : 12));
  if (!pullHeld && pull > 0) { pull *= Math.pow(0.0005, dt); if (pull < 0.5) pull = 0; }
  for (const z in fling) { if (Math.abs(fling[z]) > 5 && !down) { scroll[z] = clamp(scroll[z] + fling[z] * dt, 0, maxScroll[z]); fling[z] *= Math.pow(0.04, dt); if (z === 'puzzle') autoScroll = false; } else if (!down) fling[z] = 0; }
  if (pendingResult && now >= pendingResult) { pendingResult = 0; if (screen === 'puzzle') go('result', 1); }

  hits = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const drawerShown = screen === 'puzzle' && (pkTarget === 1 || pk > 0.002);
  if (trans && now - trans.at < 380) {
    const k = easeInOut((now - trans.at) / 380);
    noHits = true;
    if (trans.dir === 0) { drawScreen(trans.from); ctx.globalAlpha = k; drawScreen(trans.to); ctx.globalAlpha = 1; }
    else {
      ctx.save(); ctx.translate(-trans.dir * k * W * 0.35, 0); drawScreen(trans.from); ctx.fillStyle = `rgba(60,0,8,${0.5 * k})`; ctx.fillRect(0, 0, W, H); ctx.restore();
      ctx.save(); ctx.translate(trans.dir * (1 - k) * W, 0); drawScreen(trans.to); ctx.restore();
    }
    noHits = false; qi.style.left = '-200px';
  } else {
    trans = null;
    if (drawerShown) { noHits = pkTarget === 1; drawPuzzle(); noHits = false; drawDrawer(); }
    else { drawScreen(screen); qi.style.left = '-200px'; }
  }
  drawParticles();
  drawToast();
  ctx.restore();
  requestAnimationFrame(frame);
}

resize();
const fontsReady = document.fonts ? Promise.race([
  Promise.all([document.fonts.load(F.kufi(20)), document.fonts.load(F.sans(16)), document.fonts.load(F.sans(16, 700))]),
  new Promise(r => setTimeout(r, 1500))
]) : Promise.resolve();
fontsReady.then(() => requestAnimationFrame(ts => { enter.splash = ts; frame(ts); }));
})();
</script>
