// ---------- input ----------

// ---------- flow ----------
const sur = n => SURAHS[n - 1];

}
function open(p) { cur = p; pk = 0; pkTarget = 0; go(prog[p.id].done ? 'result' : 'puzzle', 1); }
function guess(n) {

function drawPuzzle() {
  drawBackdrop();
  const p = cur, st = prog[p.id];
  const shift = -clamp(1 - (drawerY() - D0) / DH, 0, 1) * clamp(contentBottom + 12 - D0, 0, PUSH);
  ctx.save(); ctx.translate(0, shift);

          tick(48, gy + 23, C.green);

        ctx.globalAlpha = 1;

    ctx.restore();

  scroll.puzzle = clamp(scroll.puzzle, 0, maxScroll.puzzle);
  if (pkTarget === 0 && pk < 0.05) button('main', 16, 566, 328, 54, C.gold, st.done ? t('seeAnswer') : t('pick'), F.sans(19, 700), C.ink, () => { if (st.done) go('result', 1); else openPicker(); }, !st.done);
  else { fillRR(16, 569, 328, 54, 27, 'rgba(0,0,0,0.22)'); fillRR(16, 566, 328, 54, 27, C.gold); text(t('pick'), W / 2, 594, F.sans(19, 700), C.ink, 'center', 'middle'); }
  ctx.restore();
}

function drawDrawer() {
  const y0 = drawerY();
  const active = pkTarget === 1 && pk > 0.9;
  if (active) hit(0, 0, W, y0, () => closePicker(), null, 'shade');
  const sh = ctx.createLinearGradient(0, y0 - 18, 0, y0); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = sh; ctx.fillRect(0, y0 - 18, W, 18);
  fillRR(0, y0, W, H - y0 + 30, 22, C.parch);
  fillRR(W / 2 - 22, y0 + 8, 44, 5, 3, C.grey);
  text(t('pickTitle'), 22, y0 + 44, F.kufi(20, 700), C.ink);
  text(t('pullHint'), 338, y0 + 42, F.sans(12, 500), C.muted, 'right');
  const sy = y0 + 58;
  const focused = document.activeElement === qi;
  fillRR(16, sy, 328, 40, 20, '#fbf5e6'); strokeRR(16.5, sy + 0.5, 327, 39, 20, focused ? C.gold : C.grey, focused ? 2 : 1);
  ctx.beginPath(); ctx.arc(38, sy + 19, 6, 0, 7); ctx.moveTo(42.5, sy + 23.5); ctx.lineTo(47, sy + 28); ctx.strokeStyle = C.muted; ctx.lineWidth = 1.8; ctx.stroke();
  const caret = focused && Math.floor(now / 530) % 2 === 0;
  if (query) { const qs = fit(query, F.sans(16, 500), 270); text(qs, 56, sy + 26, F.sans(16, 500), C.ink); if (caret) { ctx.font = F.sans(16, 500); ctx.fillStyle = C.ink; ctx.fillRect(57 + ctx.measureText(qs).width, sy + 11, 1.5, 19); } }
  else { text(t('search'), 56, sy + 26, F.sans(15, 400), C.muted); if (caret) { ctx.fillStyle = C.ink; ctx.fillRect(55, sy + 11, 1.5, 19); } }
  if (active) { placeInput(16, sy, 328, 40); hit(16, sy, 328, 40, () => qi.focus(), null, 'search'); } else qi.style.left = '-200px';
  const top = sy + 46, list = filtered(), st = prog[cur.id], rowH = 54, bottom = Math.max(top + rowH, visibleBottom());
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, bottom - top); ctx.clip();
  maxScroll.picker = Math.max(0, list.length * rowH - (bottom - top) + 20);
  scroll.picker = clamp(scroll.picker, 0, maxScroll.picker);
  const first = Math.max(0, Math.floor(scroll.picker / rowH) - 1);
  for (let i = first; i < Math.min(list.length, first + 14); i++) {
    const s = list[i], y = top + i * rowH - scroll.picker, used = st.guesses.includes(s[0]), rid = 'row' + s[0];
    const ps = press(rid);
    if (pressV[rid] > 0.05) { ctx.fillStyle = `rgba(201,154,59,${0.25 * pressV[rid]})`; ctx.fillRect(0, y, W, rowH); }
    else if (i % 2 === 0) { ctx.fillStyle = 'rgba(201,154,59,0.07)'; ctx.fillRect(0, y, W, rowH); }
    withScale(180, y + rowH / 2, ps, () => {
      ctx.globalAlpha = used ? 0.6 : 1;
      ctx.beginPath(); ctx.arc(36, y + rowH / 2, 15, 0, 7);
      if (used) { ctx.fillStyle = C.redSoft; ctx.fill(); ctx.strokeStyle = C.red; } else ctx.strokeStyle = C.goldDark;
      ctx.lineWidth = 1.2; ctx.stroke();
      text(String(s[0]), 36, y + rowH / 2 + 4.5, F.sans(12, 700), used ? C.redInk : C.goldDark, 'center');
      text(fit(s[1], F.sans(17, 700), 170), 62, y + 24, F.sans(17, 700), C.ink);
      text(fit(used ? t('guessed') : (lang === 'ms' ? s[2] : s[3]), F.sans(13, used ? 700 : 400), 170), 62, y + 42, F.sans(13, used ? 700 : 400), used ? C.red : C.ink2);
      text(s[4], 340, y + 35, F.ar(22, 700), C.ink, 'right');
      ctx.globalAlpha = 1;
    });
    if (!used && active) hit(0, y, W, rowH, () => { vib(10); guess(s[0]); }, [top, bottom], rid);
  }
  if (!list.length) text(t('noResult'), W / 2, top + 40, F.sans(15, 500), C.ink2, 'center');
  ctx.restore();
}
function placeInput(x, y, w, h) {
  const r = cv.getBoundingClientRect();
  qi.style.left = (r.left + ox + x * scale) + 'px'; qi.style.top = (r.top + oy + y * scale) + 'px';
  qi.style.width = (w * scale) + 'px'; qi.style.height = (h * scale) + 'px';
}

// The answer page fits one screen: the summary drops a size if the card would run long.
function drawResult() {
  drawBackdrop();
  const p = cur, st = prog[p.id], s = sur(p.answer), e = enter.result;
  header(`${p.diff[lang]} · ${p.day[lang]}`); langToggle();
  const step = (d, dur = 450) => reduce ? 1 : easeOut(k01(e + d, dur));
  const avail = 556 - 82;
  let fs = 16, lh = 21, sumL, noteL, cardH;
  const measure = () => {
    sumL = wrap(p.summary[lang], F.sans(fs, 400), 296);
    noteL = p.note ? wrap(p.note[lang], F.sans(fs - 3, 400), 296) : [];
    cardH = 186 + sumL.length * lh + (noteL.length ? 6 + noteL.length * (lh - 4) : 0) + 16 + 20 + 2 * 20 + 42;
  };
  measure(); while (cardH > avail && fs > 13) { fs--; lh--; measure(); }
  const y = 82 + Math.max(0, (avail - cardH) / 2);
  const kc = reduce ? 1 : easeBack(k01(e + 60, 560));
  withScale(180, y + cardH / 2, 0.9 + 0.1 * kc, () => {
    ctx.globalAlpha = clamp(kc, 0, 1);
    fillRR(16, y + 4, 328, cardH, 14, 'rgba(0,0,0,0.25)');
    fillRR(16, y, 328, cardH, 14, C.parch);
    strokeRR(21, y + 5, 318, cardH - 10, 10, 'rgba(138,100,22,0.35)');
    ctx.save(); ctx.globalAlpha = 0.12 * clamp(kc, 0, 1); ctx.strokeStyle = C.goldDark; ctx.lineWidth = 1.4;
    starPath(W / 2, y + 70, 56, now / 9000); ctx.stroke(); starPath(W / 2, y + 70, 40, -now / 7000); ctx.stroke(); ctx.restore();
    ctx.globalAlpha = step(250);
    text((st.solved ? t('solvedIn')(st.guesses.length) : t('missed')).toUpperCase(), W / 2, y + 28, F.sans(12, 700), st.solved ? C.green : C.red, 'center');
    const ka = reduce ? 1 : easeBack(k01(e + 350, 600));
    ctx.globalAlpha = clamp(ka, 0, 1);
    withScale(W / 2, y + 66, 0.6 + 0.4 * ka, () => text(s[4], W / 2, y + 78, F.ar(40, 700), C.ink, 'center'));
    ctx.globalAlpha = step(550);
    text(s[1], W / 2, y + 124 + (1 - step(550)) * 10, F.kufi(26, 700), C.ink, 'center');
    text(t('surahNo')(s[0], s[5], s[6] ? t('makki') : t('madani')), W / 2, y + 146, F.sans(14, 500), C.ink2, 'center');
    ctx.globalAlpha = 1;
    for (let j = 0; j < 6; j++) {
      const n = st.guesses.length, x = W / 2 - 3 * 24 + j * 24 + 2;
      const c = j < n ? (st.solved && j === n - 1 ? C.green : C.red) : C.grey;
      const kq = reduce ? 1 : easeBack(k01(e + 700 + j * 90, 380));
      if (kq > 0) withScale(x + 10, y + 168, kq, () => fillRR(x, y + 158, 20, 20, 5, c));
    }
    let cy = y + 196;
    ctx.globalAlpha = step(1100);
    ctx.fillStyle = 'rgba(91,74,53,0.18)'; ctx.fillRect(32, cy - 6, 296, 1);
    sumL.forEach((ln, j) => text(ln, 32, cy + 14 + j * lh + (1 - step(1100)) * 8, F.sans(fs, 400), C.ink));
    cy += 4 + sumL.length * lh;
    if (noteL.length) { cy += 6; noteL.forEach((ln, j) => text(ln, 32, cy + 12 + j * (lh - 4), F.sans(fs - 3, 400), C.ink2)); cy += noteL.length * (lh - 4); }
    cy += 16;
    ctx.globalAlpha = step(1250);
    text(t('refs').toUpperCase(), 32, cy + 12, F.sans(11, 700), C.goldDark);
    cy += 20;
    p.hints.forEach((h0, j) => { const col = j % 3, row = Math.floor(j / 3); text(`${j + 1} · ${h0.ref || '–'}`, 32 + col * 100, cy + 14 + row * 20, F.sans(13, 500), C.ink); });
    cy += 2 * 20 + 6;
    text(fit(t('draft'), F.sans(11, 400), 296), 32, cy + 10, F.sans(11, 400), C.muted);
    ctx.globalAlpha = 1;
  });
  button('copy', 16, 566, 158, 54, C.gold, t('copy'), F.sans(17, 700), C.ink, () => copyResult(p), true);
  button('home', 186, 566, 158, 54, '#2f4a3b', t('back'), F.sans(17, 700), C.parch, () => go('home', -1));
  const bk = 'res' + p.id + e;
  if (st.solved && !burstDone[bk] && now > e + 420 && !reduce) { burstDone[bk] = 1; burst(W / 2, y + 70, [C.gold, C.goldLight, C.green, C.parch], 40); }
}

function drawParticles() {
  particles = particles.filter(q => now - q.born < q.life);
  for (const q of particles) {
    const a = (now - q.born) / q.life;
    q.vy += 520 * dt; q.vx *= 0.985; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    ctx.globalAlpha = 1 - a * a; ctx.fillStyle = q.c;
    starPath(q.x, q.y, q.r, q.rot); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawToast() {
  if (!toast) return; const age = now - toast.at; if (age > 2200) { toast = null; return; }
  const a = Math.min(1, age / 160, (2200 - age) / 300), lines = wrap(toast.s, F.sans(14, 700), 280), h = 20 + lines.length * 18;
  const y = 548 - h + (1 - easeOut(Math.min(1, age / 260))) * 30;
  ctx.globalAlpha = a; fillRR(30, y, 300, h, 12, C.ink);
  lines.forEach((ln, j) => text(ln, W / 2, y + 24 + j * 18, F.sans(14, 700), C.parch, 'center'));
  ctx.globalAlpha = 1;
}

function drawScreen(name) {
  if (name === 'splash') drawSplash();
  else if (name === 'home') drawHome();
  else if (name === 'puzzle') drawPuzzle();
  else if (name === 'result') drawResult();
}

function frame(ts) {
  now = ts; dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
  pk += (pkTarget - pk) * Math.min(1, dt * (reduce ? 60 : 11));
  lift += ((pkTarget === 1 && document.activeElement === qi ? 1 : 0) - lift) * Math.min(1, dt * (reduce ? 60 : 12));
  if (!pullHeld && pull > 0) { pull *= Math.pow(0.0005, dt); if (pull < 0.5) pull = 0; }
  for (const z in fling) { if (Math.abs(fling[z]) > 5 && !down) { scroll[z] = clamp(scroll[z] + fling[z] * dt, 0, maxScroll[z]); fling[z] *= Math.pow(0.04, dt); if (z === 'puzzle') autoScroll = false; } else if (!down) fling[z] = 0; }
  if (pendingResult && now >= pendingResult) { pendingResult = 0; if (screen === 'puzzle') go('result', 1); }

  hits = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const drawerShown = screen === 'puzzle' && (pkTarget === 1 || pk > 0.002);
  if (trans && now - trans.at < 380) {
    const k = easeInOut((now - trans.at) / 380);
    noHits = true;
    if (trans.dir === 0) { drawScreen(trans.from); ctx.globalAlpha = k; drawScreen(trans.to); ctx.globalAlpha = 1; }
    else {
      ctx.save(); ctx.translate(-trans.dir * k * W * 0.35, 0); drawScreen(trans.from); ctx.fillStyle = `rgba(10,18,14,${0.5 * k})`; ctx.fillRect(0, 0, W, H); ctx.restore();
      ctx.save(); ctx.translate(trans.dir * (1 - k) * W, 0); drawScreen(trans.to); ctx.restore();
    }
    noHits = false; qi.style.left = '-200px';
  } else {
    trans = null;
    if (drawerShown) { noHits = pkTarget === 1; drawPuzzle(); noHits = false; drawDrawer(); }
    else { drawScreen(screen); qi.style.left = '-200px'; }
  }
  drawParticles();
  drawToast();
  ctx.restore();
  requestAnimationFrame(frame);
}

resize();
const fontsReady = document.fonts ? Promise.race([
  Promise.all([document.fonts.load(F.kufi(20)), document.fonts.load(F.sans(16)), document.fonts.load(F.sans(16, 700)), document.fonts.load(F.ar(20, 700))]),
  new Promise(r => setTimeout(r, 1500))
]) : Promise.resolve();
fontsReady.then(() => requestAnimationFrame(ts => { enter.splash = ts; frame(ts); }));
})();
</script>
